; =====================================================================
;  PlatformIO project configuration — CYD Oscilloscope
;  ---------------------------------------------------------------------
;  Usage:
;    1. Install PlatformIO (VS Code extension or `pip install platformio`)
;    2. Open this folder (cyd_oscilloscope/) as a PlatformIO project
;    3. Build / Upload — the libraries are used from ./libraries and
;       TFT_eSPI is already configured for the CYD, so no manual editing.
;
;  The bundled TFT_eSPI already contains the CYD User_Setup.h, so the
;  display works out of the box. If you prefer the registry versions
;  instead, comment out `lib_extra_dirs` and uncomment `lib_deps` below.
; =====================================================================

[platformio]
src_dir = ESP32_CYD_Oscilloscope

[env:esp32dev]
platform  = espressif32
board     = esp32dev
framework = arduino

monitor_speed = 115200
upload_speed  = 921600

; Use the pre-configured libraries shipped in ./libraries
lib_extra_dirs = libraries

; --- Alternative: fetch from the PlatformIO registry instead ---
; lib_deps =
;     bodmer/TFT_eSPI@^2.5.43
;     paulstoffregen/XPT2046_Touchscreen@^1.4.0

build_flags = -DCORE_DEBUG_LEVEL=0
